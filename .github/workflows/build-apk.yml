name: Build APK + AAB
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/options-analyst.jks
      - name: Verify keystore exists
        run: |
          ls -la app/options-analyst.jks
          echo "Keystore size: $(stat -c%s app/options-analyst.jks) bytes"
      # Иконки: легаси (ic_launcher) + адаптивная (foreground/background + anydpi-v26)
      - name: Copy icons to app res
        run: |
          set -e
          RES=app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $RES/mipmap-$d; done
          mkdir -p $RES/mipmap-anydpi-v26
          cp icon-72.png  $RES/mipmap-mdpi/ic_launcher.png
          cp icon-192.png $RES/mipmap-hdpi/ic_launcher.png
          cp icon-192.png $RES/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png $RES/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $RES/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            cp icon-fg-432.png $RES/mipmap-$d/ic_launcher_foreground.png
            cp icon-bg-432.png $RES/mipmap-$d/ic_launcher_background.png
          done
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@mipmap/ic_launcher_background"/>' \
            '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
            '</adaptive-icon>' > $RES/mipmap-anydpi-v26/ic_launcher.xml
          cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "=== res tree ==="
          find $RES -name "ic_launcher*" | sort
      # APK — для прямой установки на телефон (быстрый тест)
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ github.workspace }}/app/options-analyst.jks
          KEY_ALIAS: options-analyst
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      # AAB — для загрузки в Google Play
      - name: Build release AAB
        run: gradle bundleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ github.workspace }}/app/options-analyst.jks
          KEY_ALIAS: options-analyst
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      - name: Find artifacts
        run: |
          echo "=== APK ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== AAB ==="
          find . -name "*.aab" 2>/dev/null || echo "No AAB found"
      # Загружаем APK отдельным артефактом — его ставим на телефон
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OptionsAnalyst-APK
          path: "**/*release*.apk"
          retention-days: 30
      # Загружаем AAB отдельным артефактом — его льём в Play Console
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OptionsAnalyst-AAB
          path: "**/*release*.aab"
          retention-days: 30
